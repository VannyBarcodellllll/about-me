<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),copy=x=>JSON.parse(JSON.stringify(x)),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fonts={modern:"'Work Sans',sans-serif",clean:"Anton,sans-serif",classic:"Georgia,serif",simple:"Arial,sans-serif"};
const defaults={"accent":"#242424","paper":"#f7f7f5","ink":"#242424","muted":"#575754","surface":"#ececea","bodyFont":"modern","headingFont":"clean","spacing":120,"width":1400,"radius":0,"headingSize":110};
function migrate(p){if(p.version===2)return p;return {version:2,brand:p.name+'.',footer:'© '+new Date().getFullYear()+' '+p.name+'. A little space of my own.',title:p.name+' | About me',description:p.intro,theme:{...defaults,accent:p.accent||defaults.accent},sections:[{id:'home',type:'hero',label:'Home',eyebrow:p['eyebrow'],title:'Hello, I’m',subtitle:p.name,text:p.intro,note:p.note,image:p.photo||'',imageAlt:'Portrait of '+p.name,imageCaption:'A NEW CHAPTER',buttonText:'A little about me ↘',buttonUrl:'#about',layout:'split'},{id:'about',type:'about',label:'About',eyebrow:'01 / THE PERSON',title:'A little about me.',text:p.bio,tags:p.interests||[],layout:'split'},{id:'journey',type:'project',label:'My journey',eyebrow:'02 / THE BEGINNING',title:'Made by me.',subtitle:p.projectTitle,text:p.projectText,cardLabel:'PROJECT 001',layout:'split'},{id:'contact',type:'contact',label:'Connect',eyebrow:'03 / SAY HELLO',title:p.contactTitle,text:p.contactText,links:[...(p.github?[{text:'GitHub ↗',url:p.github}]:[]),...(p.social?[{text:'Find me online ↗',url:p.social}]:[]),...(p.email?[{text:'Say hello ↗',url:'mailto:'+p.email}]:[])]}]}}
let model=migrate(JSON.parse($('profile-data').textContent)),selected=model.sections[0]?.id,editing=false,preview=false,tab='sections',history=[],future=[],dirty=false;
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
const key='about-me-redesign-v3',legacyKey='about-me-builder-v2';
const safeUrl=v=>{if(/^#[a-z0-9_-]+$/i.test(v))return v;try{const u=new URL(v);return ['https:','http:','mailto:'].includes(u.protocol)?u.href:''}catch{return ''}};
const safeImage=v=>/^data:image\/(png|jpeg|webp);base64,[a-z0-9+/=]+$/i.test(v)?v:'';
const text=(s,k,tag='p',cls='')=>(!s[k])?'':`<${tag} class="${cls}" data-edit="${k}" ${editing&&!preview&&!moving?'contenteditable="plaintext-only" role="textbox" aria-label="'+esc((s.label||s.id)+' '+k)+'"':''}>${esc(s[k])}</${tag}>`;
const button=s=>s.buttonText&&safeUrl(s.buttonUrl)?`<a class="button" href="${esc(safeUrl(s.buttonUrl))}">${esc(s.buttonText)}</a>`:'';
const image=s=>safeImage(s.image)?`<img class="extra-image" src="${safeImage(s.image)}" alt="${esc(s.imageAlt||'')}" width="1265" height="800" loading="lazy">`:'';
function checkpoint(){history.push(copy(model));if(history.length>40)history.shift();future=[];dirty=true;updateHistory()}
function updateHistory(){$('undo').disabled=!history.length;$('redo').disabled=!future.length;$('draftState').textContent=dirty?'Unsaved changes':'Ready to create'}
function status(message){$('builderStatus').textContent=message}
function applyTheme(){const t={...defaults,...model.theme};for(const k of ['accent','paper','ink','muted','surface'])document.documentElement.style.setProperty('--'+k,/^#[a-f0-9]{6}$/i.test(t[k])?t[k]:defaults[k]);for(const [k,v]of [['space',t.spacing],['pagewidth',t.width],['radius',t.radius],['headsize',t.headingSize]])document.documentElement.style.setProperty('--'+k,Number(v)+'px');document.documentElement.style.setProperty('--bodyfont',fonts[t.bodyFont]||fonts.modern);document.documentElement.style.setProperty('--headfont',fonts[t.headingFont]||fonts.clean)}
function renderPage(){applyTheme();$('siteBrand').textContent=model.brand;$('footerWordmark').textContent='';$('siteFooter').textContent=model.footer;document.title=model.title||'My personal website';document.querySelector('meta[name=description]').content=model.description||'';$('siteNav').innerHTML=model.sections.filter(s=>s.label).map(s=>`<a href="#${esc(s.id)}">${esc(s.label)}</a>`).join('');$('main').innerHTML=model.sections.map(s=>{let body='',cls=s.type==='hero'?'hero':s.type==='contact'?'contact':'section';if(s.layout==='stacked')cls+=' stacked';if(s.layout==='reverse')cls+=' reverse';if(s.layout==='text')cls+=' no-image';if(s.align==='center')cls+=' centered';
if(s.type==='hero')body=`<h1>${text(s,'title','span')}${text(s,'subtitle','span')}</h1><div class="hero-summary">${text(s,'text','p','intro')}${button(s)}${text(s,'note','p','smallnote')}</div><figure class="portrait">${safeImage(s.image)?`<img src="${safeImage(s.image)}" alt="${esc(s.imageAlt)}" width="1265" height="720" fetchpriority="high">`:''}${text(s,'imageCaption','figcaption','portrait-label')}</figure>`;
else if(s.type==='contact')body=`${text(s,'eyebrow','p','section-meta')}${text(s,'title','h2')}${text(s,'text')}${image(s)}<div class="links">${(s.links||[]).filter(l=>safeUrl(l.url)).map(l=>`<a class="button" href="${esc(safeUrl(l.url))}">${esc(l.text)}</a>`).join('')}</div>`;
else body=`<div>${text(s,'eyebrow','div','section-meta')}${text(s,'title','h2')}</div><div class="section-content">${s.type==='project'?`<article class="project" data-ui>${text(s,'cardLabel','p','section-meta')}${text(s,'subtitle','h3')}${text(s,'text')}${image(s)}${button(s)}</article>`:`${text(s,'text')}${s.tags?`<div class="tags">${s.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`:''}${image(s)}${button(s)}`}</div>`;
return `<section id="${esc(s.id)}" data-section="${esc(s.id)}" class="${cls}${editing&&selected===s.id&&!preview?' selected':''}" style="${/^#[a-f0-9]{6}$/i.test(s.background||'')?'background:'+s.background+';padding-left:20px;padding-right:20px;':''}">${body}</section>`}).join('')||'<div class="empty-state">Your blank canvas. Add a section to begin.</div>';registerObjects();observeEntrances();
}
function field(id,label,value,type='text',opts=''){return `<label for="${id}">${label}</label>${type==='textarea'?`<textarea name="${id}" autocomplete="off" id="${id}" ${opts}>${esc(value)}</textarea>`:type==='select'?`<select id="${id}" ${opts}>${value}</select>`:`<input id="${id}" name="${id}" autocomplete="off" type="${type}" value="${esc(value)}" ${opts}>`}`}
const options=(values,value)=>values.map(([v,l])=>`<option value="${v}" ${value===v?'selected':''}>${l}</option>`).join('');

$('builderPanel').addEventListener('change',e=>{if(e.target.id==='objectPicker'){selectObject(e.target.value);selectedNode()?.scrollIntoView({block:'center'});}});
$('builderPanel').addEventListener('input',e=>{const k=e.target.dataset.position;if(!k||!objectId)return;const value=Number(e.target.value);if(!Number.isFinite(value))return;checkpoint();const p=currentPosition();p[k]=value*100/$('canvas').getBoundingClientRect().width;writePosition(objectId,p.x,p.y);status('Object position updated.')});
$('builderPanel').addEventListener('click',e=>{const id=e.target.closest('button')?.id;if(id==='toggleMovePanel'){setMoving(!moving);return}if(!['resetObject','resetMobile','resetAllObjects','objectForward','objectBackward'].includes(id))return;checkpoint();const store=positionStore();if(id==='resetAllObjects')model.positions={};else{store[objectId]||={};if(id==='resetObject')store[objectId][placementMode()]={x:0,y:0};if(id==='resetMobile')delete store[objectId].mobile;if(id==='objectForward')store[objectId].z=Math.min(50,(store[objectId].z||0)+1);if(id==='objectBackward')store[objectId].z=Math.max(0,(store[objectId].z||0)-1)}applyPositions();renderPanel();status('Object placement updated.');});
window.addEventListener('resize',()=>{if(editing&&tab==='objects')renderPanel()});
function normalizePositions(input,idMap){const out={};if(!input||typeof input!=='object')return out;for(const [id,p]of Object.entries(input)){if(!p||typeof p!=='object')continue;let [owner,part]=id.split('|');if(!part)continue;if(owner==='nav')part=idMap.get(part)||part;else if(owner!=='global')owner=idMap.get(owner)||owner;const clean={z:Math.max(0,Math.min(50,Number(p.z)||0))};for(const mode of ['desktop','mobile'])if(p[mode]&&Number.isFinite(p[mode].x)&&Number.isFinite(p[mode].y))clean[mode]={x:Math.max(-200,Math.min(200,p[mode].x)),y:Math.max(-200,Math.min(200,p[mode].y))};out[owner+'|'+part]=clean;}return out}

const barObserver=new ResizeObserver(()=>document.documentElement.style.setProperty('--bar-height',Math.max(66,$('builderBar').getBoundingClientRect().height)+'px'));barObserver.observe($('builderBar'));
let entranceObserver;
function observeEntrances(){
  if(!entranceObserver&&'IntersectionObserver' in window)entranceObserver=new IntersectionObserver(entries=>{for(const entry of entries)if(entry.isIntersecting){entry.target.classList.add('entered');entranceObserver.unobserve(entry.target)}},{threshold:.08});
  if(entranceObserver&&!editing)document.querySelectorAll('.canvas .section,.canvas .contact').forEach(section=>entranceObserver.observe(section));
}

renderPage();updateHistory();observeEntrances();if(location.hash==='#edit')setEditing(true);
})();

</script>
